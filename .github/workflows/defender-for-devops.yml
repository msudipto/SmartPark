# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Microsoft Security DevOps (MSDO) is a command line application that
# integrates static-analysis tools into the development cycle.
#
# MSDO currently supports Windows runners. For more information:
# https://github.com/microsoft/security-devops-action

name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 13 * * 5'

permissions:
  contents: read
  security-events: write

jobs:
  MSDO:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            5.0.x
            6.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Bandit
        run: python -m pip install --upgrade bandit bandit-sarif-formatter

      - name: Run Bandit
        shell: bash
        continue-on-error: true
        run: |
          python -m bandit -r . \
            -f sarif \
            -o bandit.sarif \
            --exclude './.git,./node_modules,./venv,./.venv'

      - name: Upload Bandit results
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1.6.0
        id: msdo

      - name: Upload MSDO results
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
